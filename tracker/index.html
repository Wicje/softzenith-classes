
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Studio Content Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121214; color: #e1e1e6; padding: 2rem; }
    h1 { color: #fff; }
    form { margin-bottom: 2rem; display: flex; gap: 10px; }
    input, select, button { padding: 8px 12px; background: #202024; border: 1px solid #41414c; color: #fff; border-radius: 4px; }
    button { background: #04d361; border: none; cursor: pointer; color: #000; font-weight: bold; }
    #project-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .project-card { background: #202024; border: 1px solid #323238; padding: 1.5rem; border-radius: 6px; }
    .project-card.completed { border-left: 5px solid #04d361; }
    .project-card.in-progress { border-left: 5px solid #ffcd33; }
    .status-badge { font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
    .completed .status-badge { color: #04d361; }
    .in-progress .status-badge { color: #ffcd33; }
    .project-card button { background: #41414c; color: #fff; font-size: 0.8rem; margin-top: 10px; font-weight: normal;}
  </style>
</head>
<body>

  <h1>Studio Content Tracker</h1>
  
  <form id="project-form">
    <input type="text" id="proj-title" placeholder="Project Title" required />
    <select id="proj-type">
      <option value="Film">Film</option>
      <option value="Photography">Photography</option>
      <option value="Visual Identity">Visual Identity</option>
    </select>
    <button type="submit">Add Project</button>
  </form>

  <div id="project-container"></div>

  <script src="app.js"></script>
</body>
</html>
